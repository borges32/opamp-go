{{ template "header.html" . }}

<!-- Main Content -->
<main x-data="agentManager()" x-init="init()" class="space-y-6">
    
    <!-- Stats Card -->
    <div class="grid grid-cols-1 md:grid-cols-1 gap-6 max-w-md">
        <!-- Total Agents -->
        <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200 hover:shadow-xl">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm font-medium">Connected Agents</p>
                    <p class="text-3xl font-bold text-slate-800 mt-2" x-text="totalAgents"></p>
                    <p class="text-slate-400 text-xs mt-1">Active connections</p>
                </div>
                <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-4 rounded-lg shadow-lg">
                    <i class="fas fa-network-wired text-white text-2xl"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters and Search -->
    <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <!-- Search Bar -->
            <div class="flex-1 max-w-md">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-slate-400"></i>
                    </div>
                    <input 
                        type="text" 
                        x-model="searchQuery"
                        @input="filterAgents()"
                        placeholder="Search by hostname or instance ID..."
                        class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-slate-700"
                    >
                </div>
            </div>
            
            <!-- Items per page -->
            <div class="flex items-center space-x-4">
                <label class="text-slate-600 font-medium">Show:</label>
                <select 
                    x-model="itemsPerPage"
                    @change="changeItemsPerPage()"
                    class="px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-slate-700 bg-white"
                >
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </div>
        
        <!-- Results Count -->
        <div class="mt-4 text-sm text-slate-600">
            Showing <span class="font-semibold" x-text="startIndex + 1"></span> 
            to <span class="font-semibold" x-text="Math.min(endIndex, filteredAgents.length)"></span> 
            of <span class="font-semibold" x-text="filteredAgents.length"></span> agents
        </div>
    </div>

    <!-- Agents Table -->
    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-gradient-to-r from-slate-50 to-slate-100 border-b border-slate-200">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">
                            <div class="flex items-center space-x-2">
                                <i class="fas fa-fingerprint"></i>
                                <span>Instance ID</span>
                            </div>
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">
                            <div class="flex items-center space-x-2">
                                <i class="fas fa-laptop"></i>
                                <span>Host Name</span>
                            </div>
                        </th>
                        <th class="px-6 py-4 text-center text-xs font-semibold text-slate-600 uppercase tracking-wider">
                            <div class="flex items-center justify-center space-x-2">
                                <i class="fas fa-heartbeat"></i>
                                <span>Status</span>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                    <template x-for="agent in paginatedAgents" :key="agent.instanceId">
                        <tr class="hover:bg-slate-50 cursor-pointer transition-colors">
                            <td class="px-6 py-4">
                                <a :href="'agent?instanceid=' + agent.instanceId" 
                                   target="_self"
                                   rel="noopener noreferrer"
                                   class="text-blue-600 hover:text-blue-800 font-mono text-sm hover:underline flex items-center space-x-2"
                                   title="Open agent details in new tab">
                                    <i class="fas fa-external-link-alt text-xs"></i>
                                    <span x-text="agent.instanceId"></span>
                                </a>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-blue-600 rounded-lg flex items-center justify-center shadow-md">
                                        <i class="fas fa-server text-white text-sm"></i>
                                    </div>
                                    <div>
                                        <p class="text-slate-800 font-medium" x-text="agent.hostname"></p>
                                        <p class="text-slate-500 text-xs font-mono" x-text="agent.instanceId.substring(0, 16) + '...'"></p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <template x-if="agent.healthy">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 border border-green-200">
                                        <i class="fas fa-check-circle mr-2"></i>
                                        Healthy
                                    </span>
                                </template>
                                <template x-if="!agent.healthy">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800 border border-red-200">
                                        <i class="fas fa-times-circle mr-2"></i>
                                        Unhealthy
                                    </span>
                                </template>
                            </td>
                        </tr>
                    </template>
                    
                    <!-- Empty State -->
                    <template x-if="paginatedAgents.length === 0">
                        <tr>
                            <td colspan="3" class="px-6 py-12 text-center">
                                <div class="flex flex-col items-center justify-center space-y-4">
                                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center">
                                        <i class="fas fa-inbox text-slate-400 text-2xl"></i>
                                    </div>
                                    <div>
                                        <p class="text-slate-600 font-medium">No agents found</p>
                                        <p class="text-slate-400 text-sm mt-1">Try adjusting your search or filter criteria</p>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        
        <!-- Pagination -->
        <div class="bg-slate-50 px-6 py-4 border-t border-slate-200" x-show="totalPages > 1">
            <div class="flex items-center justify-between">
                <!-- Previous Button -->
                <button 
                    @click="previousPage()"
                    :disabled="currentPage === 1"
                    :class="currentPage === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-200'"
                    class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 font-medium transition-colors disabled:opacity-50 flex items-center space-x-2"
                >
                    <i class="fas fa-chevron-left"></i>
                    <span>Previous</span>
                </button>
                
                <!-- Page Numbers -->
                <div class="flex items-center space-x-2">
                    <template x-for="page in visiblePages" :key="page">
                        <button 
                            @click="goToPage(page)"
                            :class="page === currentPage ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'"
                            class="w-10 h-10 border rounded-lg font-medium transition-colors"
                            x-text="page"
                        ></button>
                    </template>
                </div>
                
                <!-- Next Button -->
                <button 
                    @click="nextPage()"
                    :disabled="currentPage === totalPages"
                    :class="currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-200'"
                    class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 font-medium transition-colors disabled:opacity-50 flex items-center space-x-2"
                >
                    <span>Next</span>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="mt-12 text-center text-slate-500 text-sm pb-8">
    <p>OpAMP Server &copy; 2025 - Open Agent Management Protocol</p>
</footer>

<!-- Alpine.js Data -->
<script>
    // Agent data from Go template
    const agentData = [{{ range $index, $agent := . }}{{ if $index }},{{ end }}
        {
            instanceId: '{{ .InstanceIdStr }}',
            hostname: '{{ getHostName . }}',
            healthy: {{ .Status.Health.Healthy }}
        }{{ end }}
    ];
    
    // Debug log
    console.log('Loaded agents:', agentData.length, agentData);
</script>

<script>
    function agentManager() {
        return {
            agents: [],
            filteredAgents: [],
            paginatedAgents: [],
            searchQuery: '',
            itemsPerPage: 25,
            currentPage: 1,
            
            init() {
                // Load agents from the global variable and filter out any empty objects
                this.agents = (agentData || []).filter(a => a && a.instanceId);
                console.log('Initialized with agents:', this.agents.length);
                this.filterAgents();
            },
            
            get totalAgents() {
                return this.agents.length;
            },
            
            get totalPages() {
                return Math.ceil(this.filteredAgents.length / this.itemsPerPage);
            },
            
            get startIndex() {
                return (this.currentPage - 1) * this.itemsPerPage;
            },
            
            get endIndex() {
                return this.startIndex + this.itemsPerPage;
            },
            
            get visiblePages() {
                const pages = [];
                const maxVisible = 7;
                
                if (this.totalPages <= maxVisible) {
                    for (let i = 1; i <= this.totalPages; i++) {
                        pages.push(i);
                    }
                } else {
                    if (this.currentPage <= 4) {
                        for (let i = 1; i <= 5; i++) pages.push(i);
                        pages.push('...');
                        pages.push(this.totalPages);
                    } else if (this.currentPage >= this.totalPages - 3) {
                        pages.push(1);
                        pages.push('...');
                        for (let i = this.totalPages - 4; i <= this.totalPages; i++) pages.push(i);
                    } else {
                        pages.push(1);
                        pages.push('...');
                        for (let i = this.currentPage - 1; i <= this.currentPage + 1; i++) pages.push(i);
                        pages.push('...');
                        pages.push(this.totalPages);
                    }
                }
                
                return pages;
            },
            
            filterAgents() {
                let filtered = this.agents;
                
                // Apply search filter
                if (this.searchQuery.trim() !== '') {
                    const query = this.searchQuery.toLowerCase();
                    filtered = filtered.filter(agent => 
                        agent.hostname.toLowerCase().includes(query) ||
                        agent.instanceId.toLowerCase().includes(query)
                    );
                }
                
                this.filteredAgents = filtered;
                this.currentPage = 1;
                this.updatePagination();
                
                console.log('Filtered agents:', this.filteredAgents.length);
                console.log('Paginated agents:', this.paginatedAgents.length);
            },
            
            updatePagination() {
                const start = this.startIndex;
                const end = this.endIndex;
                this.paginatedAgents = this.filteredAgents.slice(start, end);
                console.log('Pagination updated:', start, 'to', end, '=', this.paginatedAgents.length, 'agents');
            },
            
            changeItemsPerPage() {
                this.currentPage = 1;
                this.updatePagination();
            },
            
            previousPage() {
                if (this.currentPage > 1) {
                    this.currentPage--;
                    this.updatePagination();
                }
            },
            
            nextPage() {
                if (this.currentPage < this.totalPages) {
                    this.currentPage++;
                    this.updatePagination();
                }
            },
            
            goToPage(page) {
                if (page !== '...' && page >= 1 && page <= this.totalPages) {
                    this.currentPage = page;
                    this.updatePagination();
                }
            }
        }
    }
</script>

</div>
</body>
</html>
